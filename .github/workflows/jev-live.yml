name: Jev live test

# Runs JevEvaluator against the local model (a real strands-decider server and checkpoint, CPU),
# and against hosted Jev when the TYPESAFE_API_KEY secret is set.
on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths:
      - "grounded_ai/backends/jev.py"
      - "grounded_ai/__init__.py"
      - "tests/integration/**"
      - "tests/test_jev_contract.py"
      - "examples/backends/jev.ipynb"
      - ".github/workflows/jev-live.yml"
      - ".github/scripts/jev_live_report.py"

concurrency:
  group: jev-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DECIDER_LIVE: "1"
      DECIDER_DEVICE: cpu
      DECIDER_CHECKPOINT: StrandsAgents/strands-decider-2B-hobson-v19
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}  # hosted tests skip without it
      HF_HOME: ${{ github.workspace }}/.hf

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Cache the checkpoint
      uses: actions/cache@v4
      with:
        path: .hf
        key: hf-${{ env.DECIDER_CHECKPOINT }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch: the default Linux wheel pulls several GB of CUDA libraries.
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[jev-local]" pytest pytest-asyncio nbconvert ipykernel

    - name: Run the live tests
      run: |
        set -o pipefail
        # The contract tests also run here: with the server installed they check our classes against its wire types.
        pytest tests/test_jev_contract.py -q
        pytest tests/integration -s -v | tee live-tests.txt

    - name: Run the example notebook
      env:
        TYPESAFE_API_KEY: ""  # the notebook picks hosted Jev when a key is set; this job tests the local model
      run: |
        jupyter nbconvert --to notebook --execute examples/backends/jev.ipynb \
          --output jev.executed.ipynb --output-dir executed --ExecutePreprocessor.timeout=1800

    - name: Upload the executed notebook
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: jev-notebook
        path: executed/
        if-no-files-found: ignore

    # The real model's answers, where a reviewer can read them without opening the logs.
    - name: Post the results on the pull request
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python .github/scripts/jev_live_report.py > report.md
        gh pr comment ${{ github.event.pull_request.number }} --body-file report.md --edit-last --create-if-none
